[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nihongo"
version = "0.1.0"
description = "A lightweight CLI Japanese tutor backed by the OpenAI API"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.scripts]
nihongo = "nihongo.cli:main"

[tool.setuptools.packages.find]
include = ["nihongo*"]
